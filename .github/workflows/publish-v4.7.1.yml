name: Publish VideoShelf v4.7.1

on:
  push:
    paths:
      - ".github/workflows/publish-v4.7.1.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and verify ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p versions
          B64="/tmp/VideoShelf-v4.7.1.b64"
          ZIP="versions/VideoShelf-v4.7.1.zip"
          : > "$B64"
          for n in 01 02 03 04 05 06 07 08 09 10 11; do
            cat ".release_upload/v4.7.1/part-${n}.b64" >> "$B64"
          done
          head -c 2500 ".release_upload/v4.7.1/part-12a1.b64" >> "$B64"
          head -c 2500 ".release_upload/v4.7.1/part-12a2.b64" >> "$B64"
          head -c 2500 ".release_upload/v4.7.1/part-12b1.b64" >> "$B64"
          head -c 2500 ".release_upload/v4.7.1/part-12b2.b64" >> "$B64"
          head -c 5000 ".release_upload/v4.7.1/part-12c1.b64" >> "$B64"
          cat ".release_upload/v4.7.1/part-13.b64" >> "$B64"
          test "$(wc -c < "$B64" | tr -d ' ')" = "186716"
          base64 --decode "$B64" > "$ZIP"
          test "$(wc -c < "$ZIP" | tr -d ' ')" = "140037"
          echo "f35b7a59c33ffdbebb0d44b1300f267cb8147224f33466800fc2aa4887dafd67  $ZIP" | sha256sum -c -

      - name: Update README
        shell: python
        run: |
          from pathlib import Path
          p = Path("README.md")
          s = p.read_text(encoding="utf-8")
          old = "> آخرین نسخه: **v3.9 — OpenSSH-first 443 Fallback + 10-Star Rating**"
          new = "> آخرین نسخه: **v4.7.1 — DNS SRV Diagnostics + Explicit AUTO/HTTP2 Cloudflare Fix + 10-Star Rating**"
          if old in s:
              s = s.replace(old, new, 1)
          elif "> آخرین نسخه:" in s and "v4.7.1" not in s:
              lines = s.splitlines()
              for i, line in enumerate(lines):
                  if line.startswith("> آخرین نسخه:"):
                      lines[i] = new
                      break
              s = "\n".join(lines) + ("\n" if s.endswith("\n") else "")
          row = "| v4.7.1 | DNS SRV Diagnostics + Explicit AUTO/HTTP2 Cloudflare Fix |"
          if row not in s:
              marker = "\n## دانلود نسخه‌ها"
              s = s.replace(marker, "\n" + row + "\n" + marker, 1)
          p.write_text(s, encoding="utf-8")

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release_upload/v4.7.1
          git config user.name "kimiareza8-prog"
          git config user.email "kimiareza8@gmail.com"
          git add README.md versions/VideoShelf-v4.7.1.zip .release_upload
          git commit -m "Release VideoShelf v4.7.1"
          git push
